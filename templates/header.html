{% set current_path = request.url.path %}
<header class="site-header">
  <a class="site-brand" href="/">Customer Manager</a>
  <nav aria-label="주 메뉴" class="site-links">
    <a href="/"{% if current_path == '/' %} aria-current="page"{% endif %}>홈</a>
    <a href="/customers"{% if current_path == '/customers' or current_path.startswith('/customers/') %} aria-current="page"{% endif %}>고객 목록</a>
  </nav>
  <div class="site-account">
    {% if user %}
    <span>{{ user.name }}님 안녕하세요</span>
    <form action="/auth/logout" method="post">
      <button type="submit">로그아웃</button>
    </form>
    {% else %}
    <a href="/auth/login">로그인</a>
    <a href="/auth/register">회원가입</a>
    {% endif %}
  </div>
</header>
