<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Customer Manager{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fa; color: #182938; font: 16px/1.6 system-ui, sans-serif; }
    a { color: #175b97; }
    main { max-width: 900px; margin: 48px auto; padding: 0 24px; }
    .panel { max-width: 460px; margin: 0 auto; padding: 32px; background: white; border: 1px solid #dce3e9; border-radius: 12px; }
    h1 { margin-top: 0; font-size: 28px; }
    .fields { display: grid; gap: 18px; }
    label { display: grid; gap: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #8095a7; border-radius: 5px; font: inherit; }
    .submit { padding: 12px; border: 0; border-radius: 5px; background: #175b97; color: white; font: inherit; cursor: pointer; }
    .error { color: #a51924; }
    .success { color: #24683e; }
    :focus-visible { outline: 3px solid #dc9b22; outline-offset: 3px; }
  </style>
</head>
<body>
  {% include "header.html" %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
