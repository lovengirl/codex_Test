<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Customer Manager{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f4f6; color: #252b38; font: 16px/1.6 system-ui, sans-serif; }
    a { color: #175b97; }
    main { max-width: 1100px; margin: 48px auto; padding: 0 24px; }
    .panel { max-width: 460px; margin: 0 auto; padding: 32px; background: white; border: 1px solid #dce3e9; border-radius: 12px; }
    h1 { margin-top: 0; font-size: 28px; }
    .fields { display: grid; gap: 18px; }
    label { display: grid; gap: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #8095a7; border-radius: 5px; font: inherit; }
    .submit { padding: 12px; border: 0; border-radius: 5px; background: #175b97; color: white; font: inherit; cursor: pointer; }
    .error { color: #a51924; }
    .success { color: #24683e; }
    .site-header { display: flex; align-items: center; flex-wrap: wrap; gap: 16px 28px; padding: 18px 32px; background: #354785; color: white; box-shadow: 0 3px 10px #18234a26; font: 16px/1.6 system-ui, sans-serif; }
    .site-brand { color: white; font-size: 20px; font-weight: 750; text-decoration: none; white-space: nowrap; }
    .site-links { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .site-links a { padding: 8px 17px; border-radius: 24px; color: #e6eafa; text-decoration: none; }
    .site-links a:hover { background: #ffffff18; color: white; }
    .site-links a[aria-current="page"] { color: #354785; background: white; box-shadow: 0 2px 6px #14234d26; font-weight: 700; }
    .site-account { margin-left: auto; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .site-account span { overflow-wrap: anywhere; }
    .site-account form { margin: 0; }
    .site-account a { color: white; }
    .site-account button { padding: 8px 18px; border: 0; border-radius: 24px; background: white; color: #354785; font: inherit; cursor: pointer; }
    .home-card { padding: 56px 40px 28px; border: 1px solid #e8eaf0; border-radius: 22px; background: white; box-shadow: 0 12px 35px #2730440a; }
    .home-welcome { text-align: center; }
    .home-welcome h1 { margin-bottom: 16px; font-size: clamp(24px, 3vw, 32px); letter-spacing: -0.7px; line-height: 1.4; }
    .home-greeting { margin-bottom: 6px; color: #4e576b; }
    .home-description { margin: 0 0 26px; color: #667085; }
    .home-primary { display: inline-block; padding: 10px 22px; border-radius: 9px; background: #eef1f9; color: #354785; text-decoration: none; font-weight: 650; }
    .home-primary:hover { background: #e1e7f6; }
    .home-shortcuts { margin-top: 36px; }
    .home-shortcuts h2 { margin-bottom: 8px; font-size: 16px; }
    .home-shortcuts ul { margin: 0; padding-left: 22px; }
    .home-shortcuts li { padding: 3px 0; }
    .home-tools { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 24px; padding-top: 18px; border-top: 1px solid #edf0f4; font-size: 14px; }
    .home-tools a { color: #667085; }
    .documentation { max-width: 1440px; }
    .customer-search { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
    .customer-search-query { flex: 1 1 260px; }
    .customer-search select, .customer-search button { padding: 10px; border: 1px solid #8095a7; border-radius: 5px; font: inherit; background: white; }
    .customer-search button { cursor: pointer; }
    @media (max-width: 640px) {
      .site-header { padding: 16px 20px; gap: 12px 18px; }
      .site-brand { flex-basis: 100%; }
      .site-account { gap: 8px; font-size: 14px; }
      main { margin: 28px auto; padding: 0 16px; }
      .home-card { padding: 36px 22px 24px; }
    }
    :focus-visible { outline: 3px solid #dc9b22; outline-offset: 3px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include "header.html" %}
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
